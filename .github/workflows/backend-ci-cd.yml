
name: Build, Test, Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # BUILD, TEST AND PUBLISH CONTAINER

  build_container:
    name: Test, Build and Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      digest: ${{ steps.build.outputs.digest }}
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare artefact directories
        run: |
          mkdir -p logs
          mkdir -p test-results
          mkdir -p metadata

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee logs/npm-install.log

      - name: Run linting
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee logs/eslint.log

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          PORT: 3000
          NODE_ENV: test
        run: |
          set -o pipefail
          npm test -- --runInBand --json \
            --outputFile=test-results/jest-results.json \
            2>&1 | tee logs/jest.log

      - name: Get application version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get short Git commit SHA
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/beegeeess/the-village-cicd:latest
            ghcr.io/beegeeess/the-village-cicd:development
            ghcr.io/beegeeess/the-village-cicd:testing
            ghcr.io/beegeeess/the-village-cicd:${{ env.APP_VERSION }}
            ghcr.io/beegeeess/the-village-cicd:sha-${{ env.SHORT_SHA }}

      - name: Record build metadata
        if: always()
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Application version: ${APP_VERSION:-unavailable}"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Short commit SHA: ${SHORT_SHA:-unavailable}"
            echo "Docker image: ghcr.io/beegeeess/the-village-cicd"
            echo "Image digest: ${IMAGE_DIGEST:-unavailable}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Build date: $(date -u)"
          } | tee metadata/build-metadata.txt

      - name: Upload backend CI artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            test-results/
            metadata/
          if-no-files-found: warn
          retention-days: 30

  # PRODUCTION DEPLOYMENT

  deploy_production:
    name: Deploy to Google Cloud Run Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: build_container

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare production artefact directories
        run: |
          mkdir -p logs
          mkdir -p metadata

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run Production
        run: |
          set -o pipefail
          gcloud run deploy the-village-api-production \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --image="ghcr.io/beegeeess/the-village-cicd@${{ needs.build_container.outputs.digest }}" \
            --region="${{ vars.GCP_REGION }}" \
            --service-account="village-api-runtime@the-village-cicd.iam.gserviceaccount.com" \
            --port=8080 \
            --min=0 \
            --max=3 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            --allow-unauthenticated \
            --quiet 2>&1 | tee logs/production-deploy.log

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote approved image to production tags
        env:
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
          APP_VERSION: ${{ needs.build_container.outputs.app_version }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/beegeeess/the-village-cicd@${IMAGE_DIGEST}"

          docker buildx imagetools create \
            --tag ghcr.io/beegeeess/the-village-cicd:production \
            "$IMAGE" 2>&1 | tee logs/image-promotion.log

          docker buildx imagetools create \
            --tag "ghcr.io/beegeeess/the-village-cicd:production-${APP_VERSION}" \
            "$IMAGE" 2>&1 | tee -a logs/image-promotion.log

      - name: Record production metadata
        if: always()
        env:
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
          APP_VERSION: ${{ needs.build_container.outputs.app_version }}
        run: |
          {
            echo "Environment: production"
            echo "Service: the-village-api-production"
            echo "Application version: ${APP_VERSION:-unavailable}"
            echo "Image digest: ${IMAGE_DIGEST:-unavailable}"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Deployment date: $(date -u)"
          } | tee metadata/production-metadata.txt

      - name: Upload production deployment artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            metadata/
          if-no-files-found: warn
          retention-days: 30
