
name: Build, Test, Publish and Deploy

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

# Prevent outdated production deployments from
# running concurrently.
concurrency:
  group: village-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # 1. VALIDATE APPLICATION

  validate:
    name: Validate, Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare artefact directories
        run: |
          mkdir -p logs
          mkdir -p test-results

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee logs/npm-install.log

      - name: Run linting
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee logs/eslint.log

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          PORT: 3000
          NODE_ENV: test
        run: |
          set -o pipefail
          npm test -- --runInBand --json \
            --outputFile=test-results/jest-results.json \
            2>&1 | tee logs/jest.log

      - name: Upload validation artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  # 2. BUILD AND PUBLISH CONTAINER
  # Main branch only

  build_container:
    name: Build and Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: validate

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      digest: ${{ steps.build.outputs.digest }}
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare metadata directory
        run: mkdir -p metadata

      - name: Get application version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get short Git commit SHA
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/beegeeess/the-village-cicd:latest
            ghcr.io/beegeeess/the-village-cicd:development
            ghcr.io/beegeeess/the-village-cicd:testing
            ghcr.io/beegeeess/the-village-cicd:${{ env.APP_VERSION }}
            ghcr.io/beegeeess/the-village-cicd:sha-${{ env.SHORT_SHA }}

      - name: Record build metadata
        if: always()
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Application version: ${APP_VERSION:-unavailable}"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Short commit SHA: ${SHORT_SHA:-unavailable}"
            echo "Docker image: ghcr.io/beegeeess/the-village-cicd"
            echo "Image digest: ${IMAGE_DIGEST:-unavailable}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Build date: $(date -u)"
          } | tee metadata/build-metadata.txt

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: metadata/
          if-no-files-found: warn
          retention-days: 30

  # 3. REUSABLE PRODUCTION DEPLOYMENT
  # Main branch only

  deploy_production:
    name: Deploy to Google Cloud Run
    needs: build_container

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write

    uses: ./.github/workflows/deploy-cloud-run.yml

    with:
      image_digest: ${{ needs.build_container.outputs.digest }}
      app_version: ${{ needs.build_container.outputs.app_version }}
      short_sha: ${{ needs.build_container.outputs.short_sha }}
      service_name: the-village-api-production

    secrets: inherit
