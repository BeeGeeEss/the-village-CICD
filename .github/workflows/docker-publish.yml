
name: Build, Test, Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_container:
    name: Test, Build and Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      digest: ${{ steps.build.outputs.digest }}
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          PORT: 3000
          NODE_ENV: development
        run: npm test

      - name: Get application version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get short Git commit SHA
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/beegeeess/the-village-cicd:latest
            ghcr.io/beegeeess/the-village-cicd:development
            ghcr.io/beegeeess/the-village-cicd:testing
            ghcr.io/beegeeess/the-village-cicd:${{ env.APP_VERSION }}
            ghcr.io/beegeeess/the-village-cicd:sha-${{ env.SHORT_SHA }}

  deploy_staging:
    name: Deploy to Google Cloud Run Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: build_container

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy the-village-api-staging \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --image="ghcr.io/beegeeess/the-village-cicd@${{ needs.build_container.outputs.digest }}" \
            --region="${{ vars.GCP_REGION }}" \
            --service-account="village-api-runtime@the-village-cicd.iam.gserviceaccount.com" \
            --port=8080 \
            --min=0 \
            --max=3 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            --allow-unauthenticated \
            --quiet

      - name: Verify staging health
        run: |
          SERVICE_URL=$(gcloud run services describe the-village-api-staging \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --format="value(status.url)")

          echo "Testing: $SERVICE_URL/health"

          curl --fail --show-error --silent \
            "$SERVICE_URL/health"

  deploy_production:
    name: Deploy to Google Cloud Run Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - build_container
      - deploy_staging

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run Production
        run: |
          gcloud run deploy the-village-api-production \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --image="ghcr.io/beegeeess/the-village-cicd@${{ needs.build_container.outputs.digest }}" \
            --region="${{ vars.GCP_REGION }}" \
            --service-account="village-api-runtime@the-village-cicd.iam.gserviceaccount.com" \
            --port=8080 \
            --min=0 \
            --max=3 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            --no-allow-unauthenticated \
            --quiet

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote approved image to production tags
        env:
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
          APP_VERSION: ${{ needs.build_container.outputs.app_version }}
        run: |
          IMAGE="ghcr.io/beegeeess/the-village-cicd@${IMAGE_DIGEST}"

          docker buildx imagetools create \
            --tag ghcr.io/beegeeess/the-village-cicd:production \
            "$IMAGE"

          docker buildx imagetools create \
            --tag "ghcr.io/beegeeess/the-village-cicd:production-${APP_VERSION}" \
            "$IMAGE"
